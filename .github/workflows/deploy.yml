name: Deploy MCP Dolibarr

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Copy src to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "src/,package*.json,tsconfig.json,Dockerfile,docker-compose.yml,.dockerignore"
          target: /opt/1panel/apps/mcp-dolibarr/

      - name: Rebuild Docker on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/1panel/apps/mcp-dolibarr
            # Audit 26/11/2026 : construction AVANT bascule ; si elle echoue, le service actuel continue et
            # le deploiement est marque en echec (plus de relance silencieuse d'une ancienne image).
            echo "=== Construction ==="
            docker compose build --pull 2>&1 | tail -30
            echo "=== Bascule ==="
            docker compose up -d --remove-orphans
            for i in $(seq 1 12); do
              sleep 5
              if [ "$(curl -s -o /dev/null -w '%{http_code}' https://mcp.digitalfactory.sn/health)" = "200" ]; then
                echo "Service en ligne"; exit 0
              fi
            done
            echo "Service non disponible apres bascule" >&2
            docker compose logs --tail 20 mcp-dolibarr >&2
            exit 1
