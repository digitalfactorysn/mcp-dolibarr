# Le port n'est publié que sur la boucle locale : placez un reverse proxy HTTPS (Caddy, nginx…)
# devant pour tout accès distant. Ne publiez JAMAIS ce port en 0.0.0.0 sans TLS.
services:
  mcp-dolibarr:
    build: .
    image: mcp-dolibarr-secure:3.0.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3100:3100"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
