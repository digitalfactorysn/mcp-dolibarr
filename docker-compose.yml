services:
  mcp-dolibarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-dolibarr
    restart: unless-stopped
    # Exposé uniquement sur la machine hôte : placez un reverse proxy HTTPS devant
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - DOLIBARR_URL=${DOLIBARR_URL:?DOLIBARR_URL requis}
      - DOLIBARR_API_KEY=${DOLIBARR_API_KEY:?DOLIBARR_API_KEY requis}
      - MCP_API_TOKEN=${MCP_API_TOKEN:?MCP_API_TOKEN requis (openssl rand -hex 32)}
      - DOLIBARR_READ_ONLY=${DOLIBARR_READ_ONLY:-false}
      - DOLIBARR_DISABLED_TOOLS=${DOLIBARR_DISABLED_TOOLS:-}
      - PORT=3100
      - HOST=0.0.0.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
