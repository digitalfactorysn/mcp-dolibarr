# /etc/nginx/sites-available/mcp-dolibarr
# Reverse proxy HTTPS pour le serveur MCP Dolibarr (mode HTTP)
# Remplacez mcp.example.com par votre domaine (deploy.sh le fait automatiquement)
#
# Activer : sudo ln -s /etc/nginx/sites-available/mcp-dolibarr /etc/nginx/sites-enabled/
# Certificat : sudo certbot --nginx -d mcp.example.com

server {
    listen 80;
    server_name mcp.example.com;

    # Redirection HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    # Certificat SSL (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Logs (les en-têtes Authorization ne sont pas journalisés par le format par défaut)
    access_log /var/log/nginx/mcp-dolibarr.access.log;
    error_log  /var/log/nginx/mcp-dolibarr.error.log;

    # Optionnel : restreindre aux IP autorisées
    # allow 203.0.113.10;
    # deny all;

    location / {
        # Doit correspondre à PORT dans .env (3000 par défaut)
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers nécessaires pour SSE (Server-Sent Events)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        # Désactiver le buffering — CRITIQUE pour SSE
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        keepalive_timeout      3600s;
    }
}
